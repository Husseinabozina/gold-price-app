name: AYAR quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - run: flutter create . --project-name ayar --platforms=android,ios
      # flutter create generates a sample test that still references MyApp.
      # Our actual widget tests are in test/*_test.dart.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=AYAR_PREVIEW=true
      - uses: actions/upload-artifact@v4
        with:
          name: ayar-preview-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
